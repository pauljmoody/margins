<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4x6 Photo Crop + Margin Exporter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" aria-label="4x6 Photo Crop and Margin Tool">
    <header class="topbar">
      <div>
        <h1>4x6 Photo Crop + Margin Exporter</h1>
        <p class="subtitle">Local-only editor (no upload). Set crop and margins, then export high resolution for printing.</p>
      </div>
      <div class="themeControl">
        <label for="themeMode">Theme</label>
        <select id="themeMode" aria-label="Theme mode">
          <option value="auto">Auto</option>
          <option value="light">Day</option>
          <option value="dark">Night</option>
        </select>
      </div>
    </header>

    <section class="panel controls" aria-label="Controls">
      <div class="row">
        <label for="fileInput">Photo</label>
        <input id="fileInput" type="file" accept="image/*" />
      </div>

      <div class="row split">
        <div>
          <label for="orientation">Canvas orientation</label>
          <select id="orientation">
            <option value="4x6">4 x 6 in (Portrait)</option>
            <option value="6x4">6 x 4 in (Landscape)</option>
          </select>
        </div>
        <div>
          <label for="dpi">Export DPI</label>
          <input id="dpi" type="number" min="150" max="1200" step="50" value="300" />
        </div>
      </div>

      <fieldset>
        <legend>Margins (inches)</legend>
        <div class="row grid4">
          <div>
            <label for="marginTop">Top</label>
            <input id="marginTop" type="number" min="0" max="3" step="0.01" value="0" />
          </div>
          <div>
            <label for="marginRight">Right</label>
            <input id="marginRight" type="number" min="0" max="3" step="0.01" value="0" />
          </div>
          <div>
            <label for="marginBottom">Bottom</label>
            <input id="marginBottom" type="number" min="0" max="3" step="0.01" value="0" />
          </div>
          <div>
            <label for="marginLeft">Left</label>
            <input id="marginLeft" type="number" min="0" max="3" step="0.01" value="0" />
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Crop Position</legend>

        <div class="row">
          <label for="zoom">Zoom</label>
          <input id="zoom" type="range" min="1" max="4" step="0.01" value="1" />
          <output id="zoomOut" for="zoom">1.00x</output>
        </div>

        <div class="row">
          <label for="panX">Pan X</label>
          <input id="panX" type="range" min="-100" max="100" step="1" value="0" />
          <output id="panXOut" for="panX">0%</output>
        </div>

        <div class="row">
          <label for="panY">Pan Y</label>
          <input id="panY" type="range" min="-100" max="100" step="1" value="0" />
          <output id="panYOut" for="panY">0%</output>
        </div>

        <p class="hint">Tip: Drag directly on the preview image to pan.</p>
      </fieldset>

      <div class="row actions">
        <button id="resetBtn" type="button">Reset Crop</button>
        <button id="exportPngBtn" type="button">Export PNG</button>
        <button id="exportJpgBtn" type="button">Export JPG</button>
      </div>

      <p id="meta" class="meta" aria-live="polite"></p>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section class="panel previewPanel" aria-label="Preview">
      <canvas id="previewCanvas" width="800" height="1200"></canvas>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
